<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Creator Campaign Tracker — Titans Agency</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-bg': '#1a1a1a',
            'dark-card': '#2a2a2a',
            'accent': '#ff6b00',
            'accent-hover': '#e55f00',
            'success': '#22c55e',
            'muted': '#555555',
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #1a1a1a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(255, 107, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0); }
    }
    .pulse-today { animation: pulse-ring 2s infinite; }
    .day-cell { transition: all 0.15s ease; }
    .day-cell:active { transform: scale(0.95); }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes confetti-fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      z-index: 9999;
      animation: confetti-fall linear forwards;
    }
    @keyframes milestone-pop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .milestone-text { animation: milestone-pop 0.5s ease-out forwards; }
    @keyframes fade-out {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const CAMPAIGN_CONFIG = {
  brandName: "Natural Stacks",
  productName: "Dopamine Brain Food",
  ratePerVideo: 25,
  totalVideos: 15,
  startDate: "2026-03-25",
  endDate: "2026-04-24",
  briefLink: "https://discord.com/channels/...",
  showcaseLink: "https://affiliate-us.tiktok.com/api/v1/share/AJK4Uc0dUuXO",
};

// ============================================================
// STORAGE
// ============================================================
const STORAGE_PREFIX = "retainers_";
function storageGet(key) {
  try { const store = window.storage || window.localStorage; const val = store.getItem(STORAGE_PREFIX + key); return val ? JSON.parse(val) : null; } catch { return null; }
}
function storageSet(key, value) {
  try { const store = window.storage || window.localStorage; store.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); } catch (e) { console.error("Storage write failed:", e); }
}
function loadUserData(username) { return storageGet("user_" + username); }
function saveUserData(username, data) { storageSet("user_" + username, data); }
function getLastUser() { return storageGet("last_user"); }
function setLastUser(username) { storageSet("last_user", username); }

// ============================================================
// UTILITIES
// ============================================================
function parseDate(dateStr) { const [y, m, d] = dateStr.split("-").map(Number); return new Date(y, m - 1, d); }
function formatDateShort(date) { return date.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function formatDateISO(date) { const y = date.getFullYear(); const m = String(date.getMonth() + 1).padStart(2, "0"); const d = String(date.getDate()).padStart(2, "0"); return `${y}-${m}-${d}`; }
function getCampaignDays(config) {
  const start = parseDate(config.startDate); const end = parseDate(config.endDate);
  const days = []; const current = new Date(start);
  while (current <= end) { days.push(formatDateISO(current)); current.setDate(current.getDate() + 1); }
  return days;
}
function getTodayISO() { return formatDateISO(new Date()); }
function getDaysRemaining(config) {
  const end = parseDate(config.endDate); const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.max(0, Math.ceil((end - today) / (1000 * 60 * 60 * 24)));
}
function getPostedCount(days) { return Object.values(days).filter((d) => d.posted).length; }
function getCurrentStreak(campaignDays, daysData) {
  let streak = 0; const today = getTodayISO();
  for (let i = campaignDays.length - 1; i >= 0; i--) {
    if (campaignDays[i] > today) continue;
    if (daysData[campaignDays[i]]?.posted) { streak++; } else { break; }
  }
  return streak;
}
function buildDefaultUserData(username, pin, config) {
  const campaignDays = getCampaignDays(config);
  const days = {}; campaignDays.forEach((date) => { days[date] = { posted: false, link: "" }; });
  return { username, pin, campaign: config.brandName.toLowerCase().replace(/\s+/g, "-"), rate: config.ratePerVideo, totalVideos: config.totalVideos, startDate: config.startDate, endDate: config.endDate, days };
}
function getMilestoneThreshold(posted, total) {
  const pct = (posted / total) * 100;
  if (pct >= 100) return 100;
  if (pct >= 75) return 75;
  if (pct >= 50) return 50;
  if (pct >= 25) return 25;
  return 0;
}

// ============================================================
// CELEBRATION OVERLAY
// ============================================================
function CelebrationOverlay({ milestone, onDone }) {
  useEffect(() => {
    if (milestone) {
      const timer = setTimeout(onDone, 3000);
      return () => clearTimeout(timer);
    }
  }, [milestone, onDone]);

  if (!milestone) return null;

  const messages = {
    25: { text: "Great start!", emoji: "🔥", count: 20 },
    50: { text: "Halfway there!", emoji: "💪", count: 35 },
    75: { text: "Almost done!", emoji: "🚀", count: 50 },
    100: { text: "CAMPAIGN COMPLETE!", emoji: "🎉🏆", count: 70 },
  };
  const msg = messages[milestone] || messages[25];
  const colors = ["#ff6b00", "#22c55e", "#ffffff", "#ffd700", "#ff4444", "#44aaff"];

  const confettiPieces = Array.from({ length: msg.count }, (_, i) => {
    const left = Math.random() * 100;
    const delay = Math.random() * 1.5;
    const duration = 2 + Math.random() * 2;
    const size = 6 + Math.random() * 10;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = Math.random() > 0.5 ? "50%" : "2px";
    return (
      <div key={i} className="confetti-piece" style={{
        left: `${left}%`, width: `${size}px`, height: `${size}px`,
        backgroundColor: color, borderRadius: shape,
        animationDuration: `${duration}s`, animationDelay: `${delay}s`,
      }} />
    );
  });

  return (
    <div className="fixed inset-0 z-[9998] flex items-center justify-center pointer-events-none">
      {confettiPieces}
      <div className="milestone-text text-center px-6 py-8 bg-dark-card/95 rounded-3xl border-2 border-accent shadow-2xl backdrop-blur-sm pointer-events-auto"
        style={{ animation: "milestone-pop 0.5s ease-out forwards, fade-out 0.5s ease-in 2.3s forwards" }}>
        <div className="text-5xl mb-3">{msg.emoji}</div>
        <div className={`text-2xl font-black ${milestone === 100 ? "text-yellow-400" : "text-white"}`}>{msg.text}</div>
        <div className="text-accent font-bold text-lg mt-2">{milestone}% Complete</div>
      </div>
    </div>
  );
}

// ============================================================
// PIN SCREEN — Phone lock screen style
// ============================================================
function PinScreen({ username, isNewUser, onSuccess, onBack }) {
  const [pin, setPin] = useState("");
  const [confirmPin, setConfirmPin] = useState("");
  const [step, setStep] = useState(isNewUser ? "create" : "enter"); // create | confirm | enter
  const [error, setError] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");

  const currentPin = step === "confirm" ? confirmPin : pin;
  const setCurrentPin = step === "confirm" ? setConfirmPin : setPin;

  const handleDigit = (digit) => {
    if (currentPin.length >= 4) return;
    const next = currentPin + digit;
    setCurrentPin(next);
    setError(false);
    setErrorMsg("");

    if (next.length === 4) {
      setTimeout(() => {
        if (step === "create") {
          setStep("confirm");
        } else if (step === "confirm") {
          if (next === pin) {
            onSuccess(pin);
          } else {
            setError(true);
            setErrorMsg("PINs don't match. Try again.");
            setConfirmPin("");
            setTimeout(() => setStep("create"), 600);
            setTimeout(() => { setPin(""); setError(false); }, 600);
          }
        } else {
          // enter — validate
          const userData = loadUserData(username);
          if (userData && userData.pin === next) {
            onSuccess(next);
          } else {
            setError(true);
            setErrorMsg("Wrong PIN");
            setTimeout(() => { setCurrentPin(""); setError(false); }, 600);
          }
        }
      }, 150);
    }
  };

  const handleBackspace = () => {
    setCurrentPin(currentPin.slice(0, -1));
    setError(false);
    setErrorMsg("");
  };

  const title = step === "create" ? "Create a 4-digit PIN" : step === "confirm" ? "Confirm your PIN" : "Enter your PIN";
  const subtitle = step === "create" ? "This protects your account" : step === "confirm" ? "Enter the same PIN again" : `Logging in as ${username}`;

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-4">
      <div className="w-full max-w-xs">
        {/* Back button */}
        <button onClick={onBack} className="text-accent text-sm mb-8 flex items-center gap-1">
          ← Back
        </button>

        {/* Title */}
        <div className="text-center mb-8">
          <h2 className="text-xl font-bold mb-1">{title}</h2>
          <p className="text-muted text-sm">{subtitle}</p>
        </div>

        {/* PIN dots */}
        <div className={`flex justify-center gap-4 mb-3 ${error ? "shake" : ""}`}>
          {[0, 1, 2, 3].map((i) => (
            <div key={i} className={`w-4 h-4 rounded-full border-2 transition-all duration-150 ${
              i < currentPin.length
                ? error ? "bg-red-500 border-red-500" : "bg-accent border-accent"
                : "border-muted bg-transparent"
            }`} />
          ))}
        </div>

        {/* Error message */}
        <div className="h-6 flex items-center justify-center mb-4">
          {errorMsg && <p className="text-red-500 text-xs">{errorMsg}</p>}
        </div>

        {/* Number pad */}
        <div className="grid grid-cols-3 gap-4 px-4">
          {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => (
            <button key={n} onClick={() => handleDigit(String(n))}
              className="w-[72px] h-[72px] mx-auto rounded-full bg-dark-card border border-muted/30 text-white text-2xl font-bold flex items-center justify-center active:bg-accent active:border-accent transition-colors">
              {n}
            </button>
          ))}
          <div /> {/* empty cell */}
          <button onClick={() => handleDigit("0")}
            className="w-[72px] h-[72px] mx-auto rounded-full bg-dark-card border border-muted/30 text-white text-2xl font-bold flex items-center justify-center active:bg-accent active:border-accent transition-colors">
            0
          </button>
          <button onClick={handleBackspace}
            className="w-[72px] h-[72px] mx-auto rounded-full bg-dark-card border border-muted/30 text-muted text-xl font-bold flex items-center justify-center active:bg-dark-bg transition-colors">
            ←
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// LOGIN SCREEN
// ============================================================
function LoginScreen({ onSubmit }) {
  const [input, setInput] = useState("");
  const inputRef = useRef(null);
  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  const handleSubmit = (e) => { e.preventDefault(); const name = input.trim(); if (!name) return; onSubmit(name.startsWith("@") ? name : "@" + name); };
  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="bg-dark-card rounded-2xl p-8 w-full max-w-sm shadow-2xl">
        <div className="text-center mb-8">
          <div className="text-4xl font-bold text-accent mb-2">⚡</div>
          <h1 className="text-2xl font-bold mb-1">Campaign Tracker</h1>
          <p className="text-muted text-sm">Track your retainer progress</p>
        </div>
        <form onSubmit={handleSubmit}>
          <label className="block text-sm text-muted mb-2">Enter your Discord username</label>
          <input ref={inputRef} type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder="@janedoe"
            className="w-full bg-dark-bg border border-muted rounded-xl px-4 py-4 text-lg text-white placeholder-muted focus:outline-none focus:border-accent transition-colors min-h-[48px]" />
          <button type="submit"
            className="w-full mt-4 bg-accent hover:bg-accent-hover text-white font-bold text-lg rounded-xl py-4 transition-colors min-h-[48px] active:scale-95">
            Start Tracking
          </button>
        </form>
      </div>
    </div>
  );
}

// ============================================================
// CAMPAIGN HEADER
// ============================================================
function CampaignHeader({ config, userData, onSwitchUser }) {
  const posted = getPostedCount(userData.days); const total = config.totalVideos;
  const pct = Math.round((posted / total) * 100); const earned = posted * config.ratePerVideo;
  const totalComp = total * config.ratePerVideo; const remaining = getDaysRemaining(config);
  return (
    <div className="bg-dark-card rounded-2xl p-5 mb-4">
      <div className="flex items-center justify-between mb-4">
        <span className="text-sm text-muted">Logged in as <span className="text-white font-semibold">{userData.username}</span></span>
        <button onClick={onSwitchUser} className="text-xs text-accent hover:underline">Switch user</button>
      </div>
      <h2 className="text-xl font-bold mb-1">{config.brandName} <span className="text-muted font-normal">— {config.productName}</span></h2>
      <p className="text-sm text-muted mb-4">${config.ratePerVideo}/video × {total} videos = <span className="text-white font-semibold">${totalComp} total</span></p>
      <div className="mb-2">
        <div className="flex justify-between text-sm mb-1">
          <span><span className="text-white font-bold">{posted}</span><span className="text-muted"> / {total} videos posted</span></span>
          <span className="text-accent font-bold">{pct}%</span>
        </div>
        <div className="w-full bg-dark-bg rounded-full h-3 overflow-hidden"><div className="bg-accent h-full rounded-full transition-all duration-500 ease-out" style={{ width: `${pct}%` }} /></div>
      </div>
      <div className="flex items-center gap-2 mt-3">
        <span className="bg-dark-bg text-accent text-xs font-bold px-3 py-1 rounded-full">{remaining} days remaining</span>
        <span className="bg-dark-bg text-success text-xs font-bold px-3 py-1 rounded-full">${earned} earned</span>
      </div>
    </div>
  );
}

// ============================================================
// CALENDAR GRID
// ============================================================
function CalendarGrid({ config, userData, campaignDays, onToggleDay }) {
  const today = getTodayISO();
  return (
    <div className="bg-dark-card rounded-2xl p-5 mb-4">
      <h3 className="text-lg font-bold mb-4">📅 Calendar</h3>
      <div className="grid grid-cols-7 gap-2 mb-2">
        {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => (<div key={i} className="text-center text-xs text-muted font-semibold">{d}</div>))}
      </div>
      {(() => {
        const startDow = parseDate(config.startDate).getDay();
        const blanks = Array.from({ length: startDow }, (_, i) => (<div key={"b-" + i} />));
        const cells = campaignDays.map((dateStr, idx) => {
          const dayData = userData.days[dateStr] || { posted: false, link: "" };
          const isToday = dateStr === today; const isPast = dateStr < today; const isFuture = dateStr > today;
          const isPosted = dayData.posted; const dayNum = idx + 1;
          let bgClass = "bg-dark-bg border-dark-bg";
          if (isPosted) bgClass = "bg-success/20 border-success";
          else if (isPast) bgClass = "bg-dark-bg border-muted/30";
          else if (isFuture) bgClass = "bg-dark-bg border-dark-card";
          return (
            <button key={dateStr} onClick={() => onToggleDay(dateStr)} disabled={isFuture}
              className={`day-cell relative flex flex-col items-center justify-center rounded-xl border-2 min-h-[48px] min-w-[48px] aspect-square ${bgClass} ${isToday ? "border-accent pulse-today" : ""} ${isPosted ? "text-success" : isPast ? "text-muted" : "text-white"} ${isFuture ? "opacity-40 cursor-not-allowed" : "cursor-pointer hover:border-accent/50"}`}>
              <span className="text-xs font-bold leading-none">{dayNum}</span>
              {isPosted && <span className="text-success text-[10px] leading-none mt-0.5">✓</span>}
              {isToday && !isPosted && <span className="absolute -top-1 -right-1 w-2 h-2 bg-accent rounded-full" />}
            </button>
          );
        });
        return <div className="grid grid-cols-7 gap-2">{blanks}{cells}</div>;
      })()}
      <div className="flex items-center gap-4 mt-4 text-xs text-muted">
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-success/20 border border-success inline-block" /> Posted</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-dark-bg border border-muted/30 inline-block" /> Missed</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded border-2 border-accent inline-block" /> Today</span>
      </div>
    </div>
  );
}

// ============================================================
// VIDEO LOG
// ============================================================
function VideoLog({ config, userData, campaignDays, onUpdateLink }) {
  const today = getTodayISO();
  return (
    <div className="bg-dark-card rounded-2xl p-5 mb-4">
      <h3 className="text-lg font-bold mb-4">📋 Video Log</h3>
      <div className="space-y-2 max-h-[400px] overflow-y-auto pr-1">
        {campaignDays.map((dateStr, idx) => {
          const dayData = userData.days[dateStr] || { posted: false, link: "" };
          const isToday = dateStr === today; const isPast = dateStr < today; const isPosted = dayData.posted;
          let statusIcon, statusText, statusColor;
          if (isPosted) { statusIcon = "✅"; statusText = "Posted"; statusColor = "text-success"; }
          else if (isToday) { statusIcon = "⏳"; statusText = "Today"; statusColor = "text-accent"; }
          else if (isPast) { statusIcon = "❌"; statusText = "Missed"; statusColor = "text-muted"; }
          else { statusIcon = "⏳"; statusText = "Upcoming"; statusColor = "text-muted/60"; }
          return (
            <div key={dateStr} className={`${isToday ? "bg-accent/5 border border-accent/20" : "bg-dark-bg"} rounded-xl p-3 flex flex-col sm:flex-row sm:items-center gap-2`}>
              <div className="flex items-center gap-3 flex-1 min-w-0">
                <span className="text-xs text-muted font-mono w-8 shrink-0">D{idx + 1}</span>
                <span className="text-sm text-white w-16 shrink-0">{formatDateShort(parseDate(dateStr))}</span>
                <span className={`text-sm ${statusColor} flex items-center gap-1 w-20 shrink-0`}><span>{statusIcon}</span><span className="text-xs">{statusText}</span></span>
              </div>
              {(isPosted || isToday || isPast) && (
                <input type="url" placeholder="Paste TikTok link..." value={dayData.link || ""} onChange={(e) => onUpdateLink(dateStr, e.target.value)}
                  className="flex-1 bg-dark-card border border-muted/30 rounded-lg px-3 py-2 text-xs text-white placeholder-muted/50 focus:outline-none focus:border-accent transition-colors min-h-[36px] min-w-0" />
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// STATS BAR
// ============================================================
function StatsBar({ config, userData, campaignDays }) {
  const posted = getPostedCount(userData.days); const earned = posted * config.ratePerVideo;
  const streak = getCurrentStreak(campaignDays, userData.days); const pct = Math.round((posted / config.totalVideos) * 100);
  const stats = [
    { label: "Posted", value: `${posted}/${config.totalVideos}`, icon: "🎬" },
    { label: "Earned", value: `$${earned}`, icon: "💰" },
    { label: "Streak", value: `${streak}d`, icon: "🔥" },
    { label: "Done", value: `${pct}%`, icon: "📊" },
  ];
  return (
    <div className="fixed bottom-0 left-0 right-0 bg-dark-card/95 backdrop-blur-sm border-t border-muted/20 px-4 py-3 z-50">
      <div className="max-w-lg mx-auto grid grid-cols-4 gap-2">
        {stats.map((s) => (
          <div key={s.label} className="text-center">
            <div className="text-lg font-bold text-white leading-tight">{s.icon} {s.value}</div>
            <div className="text-[10px] text-muted uppercase tracking-wider">{s.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [screen, setScreen] = useState("loading"); // loading | login | pin | dashboard
  const [user, setUser] = useState(null);
  const [userData, setUserData] = useState(null);
  const [isNewUser, setIsNewUser] = useState(false);
  const [celebration, setCelebration] = useState(null);
  const lastMilestoneRef = useRef(0);

  const campaignDays = useMemo(() => getCampaignDays(CAMPAIGN_CONFIG), []);

  // Auto-login returning user
  useEffect(() => {
    const lastUser = getLastUser();
    if (lastUser) {
      const data = loadUserData(lastUser);
      if (data) {
        setUser(lastUser);
        setScreen("pin");
        return;
      }
    }
    setScreen("login");
  }, []);

  const handleUsernameSubmit = (username) => {
    setUser(username);
    const existing = loadUserData(username);
    setIsNewUser(!existing);
    setScreen("pin");
  };

  const handlePinSuccess = (pin) => {
    let data = loadUserData(user);
    if (!data) {
      data = buildDefaultUserData(user, pin, CAMPAIGN_CONFIG);
      saveUserData(user, data);
    }
    setLastUser(user);
    setUserData(data);
    // Set initial milestone ref so we don't celebrate on load
    const posted = getPostedCount(data.days);
    lastMilestoneRef.current = getMilestoneThreshold(posted, CAMPAIGN_CONFIG.totalVideos);
    setScreen("dashboard");
  };

  const handlePinBack = () => {
    setUser(null);
    setIsNewUser(false);
    setScreen("login");
  };

  const handleSwitchUser = () => {
    setUser(null);
    setUserData(null);
    storageSet("last_user", null);
    setScreen("login");
  };

  const handleToggleDay = (dateStr) => {
    setUserData((prev) => {
      const updated = { ...prev, days: { ...prev.days, [dateStr]: { ...prev.days[dateStr], posted: !prev.days[dateStr]?.posted } } };
      saveUserData(user, updated);

      // Check for milestone celebration
      const oldPosted = getPostedCount(prev.days);
      const newPosted = getPostedCount(updated.days);
      const oldMilestone = getMilestoneThreshold(oldPosted, CAMPAIGN_CONFIG.totalVideos);
      const newMilestone = getMilestoneThreshold(newPosted, CAMPAIGN_CONFIG.totalVideos);

      if (newMilestone > lastMilestoneRef.current && newPosted > oldPosted) {
        lastMilestoneRef.current = newMilestone;
        setCelebration(newMilestone);
      }

      return updated;
    });
  };

  const handleUpdateLink = (dateStr, link) => {
    setUserData((prev) => {
      const updated = { ...prev, days: { ...prev.days, [dateStr]: { ...prev.days[dateStr], link } } };
      saveUserData(user, updated);
      return updated;
    });
  };

  const handleCelebrationDone = useCallback(() => setCelebration(null), []);

  if (screen === "loading") {
    return (<div className="min-h-screen flex items-center justify-center"><div className="text-accent text-xl animate-pulse">Loading...</div></div>);
  }

  if (screen === "login") {
    return <LoginScreen onSubmit={handleUsernameSubmit} />;
  }

  if (screen === "pin") {
    return <PinScreen username={user} isNewUser={isNewUser} onSuccess={handlePinSuccess} onBack={handlePinBack} />;
  }

  return (
    <div className="max-w-lg mx-auto px-4 pt-4 pb-24">
      <CelebrationOverlay milestone={celebration} onDone={handleCelebrationDone} />
      <CampaignHeader config={CAMPAIGN_CONFIG} userData={userData} onSwitchUser={handleSwitchUser} />
      <CalendarGrid config={CAMPAIGN_CONFIG} userData={userData} campaignDays={campaignDays} onToggleDay={handleToggleDay} />
      <VideoLog config={CAMPAIGN_CONFIG} userData={userData} campaignDays={campaignDays} onUpdateLink={handleUpdateLink} />
      <StatsBar config={CAMPAIGN_CONFIG} userData={userData} campaignDays={campaignDays} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
