<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Campaign Tracker — Titans Agency</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 'sans': ['Inter', '-apple-system', 'system-ui', 'sans-serif'] },
          colors: {
            'dark-bg': '#0a0a0a',
            'dark-card': '#141414',
            'dark-border': '#1e1e1e',
            'dark-hover': '#1a1a1a',
            'accent': '#ff6b00',
            'accent-hover': '#e55f00',
            'success': '#10b981',
            'muted': '#525252',
            'muted-light': '#737373',
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #0a0a0a; color: #e5e5e5; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 1px; }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.3); }
      70% { box-shadow: 0 0 0 4px rgba(255, 107, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0); }
    }
    .pulse-today { animation: pulse-ring 2s infinite; }
    .day-cell { transition: all 0.1s ease; }
    .day-cell:active { transform: scale(0.96); }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes confetti-fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }
    .confetti-piece { position: fixed; top: -10px; z-index: 9999; animation: confetti-fall linear forwards; }
    @keyframes milestone-pop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fade-out { 0% { opacity: 1; } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const CAMPAIGN_CONFIG = {
  brandName: "Natural Stacks",
  productName: "Dopamine Brain Food",
  ratePerVideo: 25,
  totalVideos: 15,
  startDate: "2026-03-25",
  endDate: "2026-04-24",
  briefLink: "https://discord.com/channels/...",
  showcaseLink: "https://affiliate-us.tiktok.com/api/v1/share/AJK4Uc0dUuXO",
};

// ── Storage ──────────────────────────────────────────────────
const STORAGE_PREFIX = "retainers_";
function storageGet(key) { try { const s = window.storage || window.localStorage; const v = s.getItem(STORAGE_PREFIX + key); return v ? JSON.parse(v) : null; } catch { return null; } }
function storageSet(key, value) { try { const s = window.storage || window.localStorage; s.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); } catch {} }
function loadUserData(u) { return storageGet("user_" + u); }
function saveUserData(u, d) { storageSet("user_" + u, d); }
function getLastUser() { return storageGet("last_user"); }
function setLastUser(u) { storageSet("last_user", u); }

// ── Utilities ────────────────────────────────────────────────
function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function fmtShort(d) { return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function fmtISO(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function getCampaignDays(c) { const s = parseDate(c.startDate), e = parseDate(c.endDate), d = [], cur = new Date(s); while(cur<=e){d.push(fmtISO(cur));cur.setDate(cur.getDate()+1);} return d; }
function todayISO() { return fmtISO(new Date()); }
function daysLeft(c) { const e = parseDate(c.endDate), t = new Date(); t.setHours(0,0,0,0); return Math.max(0, Math.ceil((e-t)/(864e5))); }
function postedCount(days) { return Object.values(days).filter(d => d.posted).length; }
function streak(cDays, data) { let s = 0; const t = todayISO(); for(let i=cDays.length-1;i>=0;i--){if(cDays[i]>t)continue;if(data[cDays[i]]?.posted)s++;else break;} return s; }
function buildUser(name, pin, cfg) { const cDays = getCampaignDays(cfg); const days = {}; cDays.forEach(d => { days[d] = { posted: false, link: "" }; }); return { username: name, pin, campaign: cfg.brandName.toLowerCase().replace(/\s+/g,"-"), rate: cfg.ratePerVideo, totalVideos: cfg.totalVideos, startDate: cfg.startDate, endDate: cfg.endDate, days }; }
function milestone(posted, total) { const p = (posted/total)*100; if(p>=100)return 100; if(p>=75)return 75; if(p>=50)return 50; if(p>=25)return 25; return 0; }

// ── Icons (styled text, no SVG issues with Babel) ───────────
function IconVideo() { return <span style={{fontSize:"12px",lineHeight:1}}>{"\u25B6"}</span>; }
function IconDollar() { return <span style={{fontSize:"13px",lineHeight:1,fontWeight:700}}>$</span>; }
function IconFlame() { return <span style={{fontSize:"12px",lineHeight:1}}>{"\u25B2"}</span>; }
function IconTarget() { return <span style={{fontSize:"12px",lineHeight:1}}>{"\u25C9"}</span>; }

// ── Celebration ──────────────────────────────────────────────
function CelebrationOverlay({ ms, onDone }) {
  useEffect(() => { if(ms){const t=setTimeout(onDone,3000);return ()=>clearTimeout(t);} }, [ms, onDone]);
  if (!ms) return null;
  const msgs = { 25:{t:"Strong start",n:20}, 50:{t:"Halfway there",n:35}, 75:{t:"Final stretch",n:50}, 100:{t:"Campaign complete",n:70} };
  const m = msgs[ms]||msgs[25];
  const colors = ["#ff6b00","#10b981","#e5e5e5","#f59e0b"];
  const pieces = Array.from({length:m.n},(_,i)=>{
    const l=Math.random()*100, del=Math.random()*1.5, dur=2+Math.random()*2, sz=4+Math.random()*8, c=colors[Math.floor(Math.random()*colors.length)];
    return <div key={i} className="confetti-piece" style={{left:`${l}%`,width:`${sz}px`,height:`${sz}px`,backgroundColor:c,borderRadius:Math.random()>0.5?"50%":"1px",animationDuration:`${dur}s`,animationDelay:`${del}s`}}/>;
  });
  return (
    <div className="fixed inset-0 z-[9998] flex items-center justify-center pointer-events-none">
      {pieces}
      <div className="text-center px-8 py-6 bg-dark-card border border-dark-border rounded-lg shadow-2xl pointer-events-auto"
        style={{animation:"milestone-pop 0.4s ease-out forwards, fade-out 0.4s ease-in 2.4s forwards"}}>
        <div className={`text-xl font-extrabold tracking-tight ${ms===100?"text-amber-400":"text-white"}`}>{m.t}</div>
        <div className="text-accent font-semibold text-sm mt-1 tracking-wide">{ms}%</div>
      </div>
    </div>
  );
}

// ── PIN Screen ───────────────────────────────────────────────
function PinScreen({ username, isNewUser, onSuccess, onBack }) {
  const [pin, setPin] = useState(""); const [confirmPin, setConfirmPin] = useState("");
  const [step, setStep] = useState(isNewUser ? "create" : "enter");
  const [error, setError] = useState(false); const [errorMsg, setErrorMsg] = useState("");
  const cur = step === "confirm" ? confirmPin : pin;
  const setCur = step === "confirm" ? setConfirmPin : setPin;
  const digit = (d) => {
    if(cur.length>=4)return; const next=cur+d; setCur(next); setError(false); setErrorMsg("");
    if(next.length===4){setTimeout(()=>{
      if(step==="create"){setStep("confirm");}
      else if(step==="confirm"){if(next===pin){onSuccess(pin);}else{setError(true);setErrorMsg("PINs don't match");setConfirmPin("");setTimeout(()=>{setStep("create");setPin("");setError(false);},600);}}
      else{const ud=loadUserData(username);if(ud&&ud.pin===next){onSuccess(next);}else{setError(true);setErrorMsg("Wrong PIN");setTimeout(()=>{setCur("");setError(false);},600);}}
    },150);}
  };
  const back = () => { setCur(cur.slice(0,-1)); setError(false); setErrorMsg(""); };
  const title = step==="create"?"Create PIN":step==="confirm"?"Confirm PIN":"Enter PIN";
  const sub = step==="create"?"4 digits to secure your account":step==="confirm"?"Re-enter your PIN":`${username}`;
  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-4">
      <div className="w-full max-w-[280px]">
        <button onClick={onBack} className="text-muted-light text-xs font-medium mb-10 hover:text-white transition-colors">{"\u2190"} Back</button>
        <div className="text-center mb-8">
          <h2 className="text-lg font-bold tracking-tight text-white">{title}</h2>
          <p className="text-muted-light text-xs mt-1">{sub}</p>
        </div>
        <div className={`flex justify-center gap-3 mb-2 ${error?"shake":""}`}>
          {[0,1,2,3].map(i=>(<div key={i} className={`w-3 h-3 rounded-full transition-all duration-150 ${i<cur.length?(error?"bg-red-500":"bg-accent"):"bg-dark-border"}`}/>))}
        </div>
        <div className="h-5 flex items-center justify-center mb-6">
          {errorMsg && <p className="text-red-400 text-[11px] font-medium">{errorMsg}</p>}
        </div>
        <div className="grid grid-cols-3 gap-3">
          {[1,2,3,4,5,6,7,8,9].map(n=>(
            <button key={n} onClick={()=>digit(String(n))} className="h-[64px] rounded-lg bg-dark-card border border-dark-border text-white text-xl font-semibold flex items-center justify-center active:bg-accent active:border-accent transition-colors">{n}</button>
          ))}
          <div/>
          <button onClick={()=>digit("0")} className="h-[64px] rounded-lg bg-dark-card border border-dark-border text-white text-xl font-semibold flex items-center justify-center active:bg-accent active:border-accent transition-colors">0</button>
          <button onClick={back} className="h-[64px] rounded-lg bg-dark-card border border-dark-border text-muted text-lg font-semibold flex items-center justify-center active:bg-dark-hover transition-colors">{"\u2190"}</button>
        </div>
      </div>
    </div>
  );
}

// ── Login ────────────────────────────────────────────────────
function LoginScreen({ onSubmit }) {
  const [input, setInput] = useState(""); const ref = useRef(null);
  useEffect(() => { ref.current?.focus(); }, []);
  const go = (e) => { e.preventDefault(); const n = input.trim(); if(!n)return; onSubmit(n.startsWith("@")?n:"@"+n); };
  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="w-full max-w-sm">
        <div className="text-center mb-10">
          <div className="text-accent font-extrabold text-2xl tracking-tight mb-1">TITANS</div>
          <h1 className="text-sm font-medium text-muted-light">Campaign Tracker</h1>
        </div>
        <form onSubmit={go}>
          <label className="block text-xs font-medium text-muted-light mb-2 uppercase tracking-wider">Discord username</label>
          <input ref={ref} type="text" value={input} onChange={e=>setInput(e.target.value)} placeholder="@username"
            className="w-full bg-dark-card border border-dark-border rounded-lg px-4 py-3.5 text-sm text-white placeholder-muted focus:outline-none focus:border-accent/60 transition-colors" />
          <button type="submit" className="w-full mt-3 bg-accent hover:bg-accent-hover text-white font-semibold text-sm rounded-lg py-3.5 transition-colors active:scale-[0.98]">
            Continue
          </button>
        </form>
      </div>
    </div>
  );
}

// ── Header ───────────────────────────────────────────────────
function CampaignHeader({ config, userData, onSwitchUser }) {
  const posted = postedCount(userData.days), total = config.totalVideos;
  const pct = Math.round((posted/total)*100), earned = posted*config.ratePerVideo;
  const totalComp = total*config.ratePerVideo, rem = daysLeft(config);
  return (
    <div className="bg-dark-card border border-dark-border rounded-lg p-4 mb-3">
      <div className="flex items-center justify-between mb-3">
        <span className="text-xs text-muted">{userData.username}</span>
        <button onClick={onSwitchUser} className="text-[11px] text-muted-light hover:text-accent transition-colors">Switch</button>
      </div>
      <h2 className="text-base font-bold tracking-tight text-white">{config.brandName} <span className="text-muted font-normal">/ {config.productName}</span></h2>
      <p className="text-xs text-muted mt-1">${config.ratePerVideo}/video x {total} = <span className="text-white font-semibold">${totalComp}</span></p>
      <div className="mt-4">
        <div className="flex justify-between text-xs mb-1.5">
          <span className="text-muted"><span className="text-white font-semibold">{posted}</span> / {total} posted</span>
          <span className="text-accent font-semibold">{pct}%</span>
        </div>
        <div className="w-full bg-dark-bg rounded-sm h-1.5 overflow-hidden">
          <div className="h-full rounded-sm transition-all duration-500 ease-out" style={{width:`${pct}%`, background:"linear-gradient(90deg, #ff6b00, #f59e0b)"}}/>
        </div>
      </div>
      <div className="flex gap-2 mt-3">
        <span className="text-[11px] text-muted-light font-medium px-2 py-0.5 bg-dark-bg rounded border border-dark-border">{rem}d left</span>
        <span className="text-[11px] text-success font-medium px-2 py-0.5 bg-dark-bg rounded border border-dark-border">${earned} earned</span>
      </div>
    </div>
  );
}

// ── Calendar ─────────────────────────────────────────────────
function CalendarGrid({ config, userData, campaignDays, onToggleDay }) {
  const today = todayISO();
  const campaignSet = new Set(campaignDays);
  const months = useMemo(() => {
    const r = []; let cur = null;
    campaignDays.forEach(ds => {
      const d = parseDate(ds), k = `${d.getFullYear()}-${d.getMonth()}`;
      if(!cur||cur.key!==k){ cur={key:k,year:d.getFullYear(),month:d.getMonth(),label:d.toLocaleDateString("en-US",{month:"long",year:"numeric"})}; r.push(cur); }
    });
    return r;
  }, [campaignDays]);

  function grid(mi) {
    const {year,month}=mi, first=new Date(year,month,1), dim=new Date(year,month+1,0).getDate(), dow=first.getDay();
    const blanks = Array.from({length:dow},(_,i)=><div key={"b"+i}/>);
    const cells = Array.from({length:dim},(_,i)=>{
      const dom=i+1, d=new Date(year,month,dom), ds=fmtISO(d), inC=campaignSet.has(ds);
      if(!inC) return <div key={ds} className="flex items-center justify-center min-h-[44px] aspect-square"><span className="text-[11px] text-[#222]">{dom}</span></div>;
      const dd=userData.days[ds]||{posted:false,link:""}, isT=ds===today, isP=ds<today, isF=ds>today, posted=dd.posted;
      let bg = "bg-dark-bg border-dark-border";
      if(posted) bg = "bg-success/10 border-success/40";
      else if(isP) bg = "bg-dark-bg border-dark-border/50";
      else if(isF) bg = "bg-dark-bg border-dark-border/30";
      return (
        <button key={ds} onClick={()=>onToggleDay(ds)} disabled={isF}
          className={`day-cell relative flex flex-col items-center justify-center rounded-md border min-h-[44px] aspect-square ${bg} ${isT?"!border-accent pulse-today":""} ${posted?"text-success":isP?"text-muted":"text-white"} ${isF?"opacity-30 cursor-default":"cursor-pointer hover:border-accent/30"}`}>
          <span className="text-[11px] font-semibold leading-none">{dom}</span>
          {posted && <span className="text-success text-[9px] font-bold mt-0.5">{"\u2713"}</span>}
          {isT && !posted && <span className="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 bg-accent rounded-full"/>}
        </button>
      );
    });
    return [...blanks,...cells];
  }

  return (
    <div className="bg-dark-card border border-dark-border rounded-lg p-4 mb-3">
      <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-light mb-4">Calendar</h3>
      {months.map(mi=>(
        <div key={mi.key} className="mb-4 last:mb-0">
          <h4 className="text-[11px] font-bold text-white mb-2.5 tracking-tight">{mi.label}</h4>
          <div className="grid grid-cols-7 gap-1.5 mb-1.5">
            {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} className="text-center text-[10px] text-muted font-medium">{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1.5">{grid(mi)}</div>
        </div>
      ))}
      <div className="flex items-center gap-4 mt-3 text-[10px] text-muted">
        <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-sm bg-success/10 border border-success/40"/> Posted</span>
        <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-sm bg-dark-bg border border-dark-border/50"/> Missed</span>
        <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-sm border border-accent"/> Today</span>
      </div>
    </div>
  );
}

// ── Video Log ────────────────────────────────────────────────
function VideoLog({ config, userData, campaignDays, onUpdateLink }) {
  const today = todayISO();
  return (
    <div className="bg-dark-card border border-dark-border rounded-lg p-4 mb-3">
      <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-light mb-3">Video Log</h3>
      <div className="space-y-1 max-h-[360px] overflow-y-auto">
        {campaignDays.map((ds,idx) => {
          const dd = userData.days[ds]||{posted:false,link:""};
          const isT=ds===today, isP=ds<today, posted=dd.posted;
          let dot, label, color;
          if(posted){ dot="bg-success"; label="Posted"; color="text-success"; }
          else if(isT){ dot="bg-accent"; label="Today"; color="text-accent"; }
          else if(isP){ dot="bg-muted/40"; label="Missed"; color="text-muted"; }
          else { dot="bg-dark-border"; label="Upcoming"; color="text-muted/50"; }
          return (
            <div key={ds} className={`${isT?"bg-accent/[0.03] border border-accent/10":"border border-transparent hover:bg-dark-hover"} rounded-md px-3 py-2.5 flex flex-col sm:flex-row sm:items-center gap-2 transition-colors`}>
              <div className="flex items-center gap-2.5 flex-1 min-w-0">
                <span className="text-[10px] text-muted font-mono w-7 shrink-0">D{idx+1}</span>
                <span className="text-[11px] text-white font-medium w-14 shrink-0">{fmtShort(parseDate(ds))}</span>
                <span className={`flex items-center gap-1.5 ${color}`}>
                  <span className={`w-1.5 h-1.5 rounded-full ${dot}`}/>
                  <span className="text-[10px] font-medium">{label}</span>
                </span>
              </div>
              {(posted||isT||isP) && (
                <input type="url" placeholder="Paste link..." value={dd.link||""} onChange={e=>onUpdateLink(ds,e.target.value)}
                  className="flex-1 bg-dark-bg border border-dark-border rounded px-2.5 py-1.5 text-[11px] text-white placeholder-muted focus:outline-none focus:border-accent/40 transition-colors min-w-0" />
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Stats Bar ────────────────────────────────────────────────
function StatsBar({ config, userData, campaignDays }) {
  const posted = postedCount(userData.days), earned = posted*config.ratePerVideo;
  const s = streak(campaignDays, userData.days), pct = Math.round((posted/config.totalVideos)*100);
  const stats = [
    { label:"Posted", value:`${posted}/${config.totalVideos}`, icon:<IconVideo/> },
    { label:"Earned", value:`$${earned}`, icon:<IconDollar/> },
    { label:"Streak", value:`${s}d`, icon:<IconFlame/> },
    { label:"Done", value:`${pct}%`, icon:<IconTarget/> },
  ];
  return (
    <div className="fixed bottom-0 left-0 right-0 bg-dark-card/95 backdrop-blur-md border-t border-dark-border px-4 py-2.5 z-50">
      <div className="max-w-lg mx-auto grid grid-cols-4 gap-1">
        {stats.map(s=>(
          <div key={s.label} className="text-center">
            <div className="flex items-center justify-center gap-1.5 text-white">
              <span className="text-muted-light">{s.icon}</span>
              <span className="text-sm font-bold tracking-tight">{s.value}</span>
            </div>
            <div className="text-[9px] text-muted font-medium uppercase tracking-widest mt-0.5">{s.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("loading");
  const [user, setUser] = useState(null);
  const [userData, setUserData] = useState(null);
  const [isNew, setIsNew] = useState(false);
  const [celeb, setCeleb] = useState(null);
  const lastMs = useRef(0);
  const cDays = useMemo(() => getCampaignDays(CAMPAIGN_CONFIG), []);

  useEffect(() => {
    const lu = getLastUser();
    if(lu){const d=loadUserData(lu);if(d){setUser(lu);setIsNew(!d.pin);setScreen("pin");return;}}
    setScreen("login");
  }, []);

  const onUsername = (u) => { setUser(u); const e=loadUserData(u); setIsNew(!e||!e.pin); setScreen("pin"); };
  const onPin = (pin) => {
    let d = loadUserData(user);
    if(!d){d=buildUser(user,pin,CAMPAIGN_CONFIG);saveUserData(user,d);}
    else if(!d.pin){d.pin=pin;saveUserData(user,d);}
    setLastUser(user); setUserData(d);
    lastMs.current = milestone(postedCount(d.days), CAMPAIGN_CONFIG.totalVideos);
    setScreen("dashboard");
  };
  const onPinBack = () => { setUser(null); setIsNew(false); setScreen("login"); };
  const onSwitch = () => { setUser(null); setUserData(null); storageSet("last_user",null); setScreen("login"); };
  const onToggle = (ds) => {
    setUserData(prev => {
      const u = {...prev, days:{...prev.days,[ds]:{...prev.days[ds],posted:!prev.days[ds]?.posted}}};
      saveUserData(user,u);
      const op=postedCount(prev.days), np=postedCount(u.days);
      const nm=milestone(np,CAMPAIGN_CONFIG.totalVideos);
      if(nm>lastMs.current&&np>op){lastMs.current=nm;setCeleb(nm);}
      return u;
    });
  };
  const onLink = (ds,link) => {
    setUserData(prev => { const u={...prev,days:{...prev.days,[ds]:{...prev.days[ds],link}}}; saveUserData(user,u); return u; });
  };
  const onCelebDone = useCallback(()=>setCeleb(null),[]);

  if(screen==="loading") return <div className="min-h-screen flex items-center justify-center"><div className="text-muted text-sm">Loading</div></div>;
  if(screen==="login") return <LoginScreen onSubmit={onUsername}/>;
  if(screen==="pin") return <PinScreen username={user} isNewUser={isNew} onSuccess={onPin} onBack={onPinBack}/>;
  return (
    <div className="max-w-lg mx-auto px-4 pt-4 pb-20">
      <CelebrationOverlay ms={celeb} onDone={onCelebDone}/>
      <CampaignHeader config={CAMPAIGN_CONFIG} userData={userData} onSwitchUser={onSwitch}/>
      <CalendarGrid config={CAMPAIGN_CONFIG} userData={userData} campaignDays={cDays} onToggleDay={onToggle}/>
      <VideoLog config={CAMPAIGN_CONFIG} userData={userData} campaignDays={cDays} onUpdateLink={onLink}/>
      <StatsBar config={CAMPAIGN_CONFIG} userData={userData} campaignDays={cDays}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
